<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Agent</title><link rel="stylesheet" href="/style.css"></head><body><header><div><b>Resume Agent</b><small>简历编辑与岗位适配</small></div><nav><button id="undo">撤销</button><button id="save">保存项目</button><button id="export">导出 HTML</button><button id="print">打印 PDF</button></nav></header><main><aside><h2>01 / 导入简历</h2><label class="upload">选择原始 PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><label class="upload light">打开已保存项目<input id="project" type="file" accept=".json"></label><p class="muted">点击预览中的文字即可编辑，正文按文档流自动换行。导入时保留原始事实库。</p><h2>02 / 模板学习</h2><label class="upload light">上传参考 PDF<input id="template" type="file" accept="application/pdf,.pdf"></label><p class="muted">仅迁移样式，不复制他人的文字、照片和联系方式。</p><h2>03 / 岗位适配</h2><textarea id="jd" placeholder="粘贴完整岗位 JD，包括工作职责、要求等"></textarea><button id="analyze" class="primary">分析并生成改写建议</button><p class="muted">AI 改写需配置 API。逐条确认，原始事实库不变。仅在点击分析后向配置的模型服务发送简历与 JD。</p><div id="status" role="status"></div><div id="analysis"></div></aside><section class="workspace"><div class="toolbar"><span id="filename">未导入简历</span><div><button id="original">原稿对照</button><button id="reset">恢复原稿</button><button id="add">加正文段落</button></div></div><div class="workbody"><div id="paper" class="paper-area"><div class="empty"><h2>从原始简历开始</h2><p>导入具有可选中文字的 PDF，再编辑或按 JD 改写。</p></div></div><div id="reference" hidden></div></div></section></main><script src="/app.js"></script></body></html>
